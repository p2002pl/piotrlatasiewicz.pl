<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ostyluj stronę według wytycznych</title>
    <link rel="stylesheet" href="main.css">

    <!-- wszystkie style powinno się robić w CSS, ale tutaj tak sobie ćwiczymy tagi "style" i liniowe atrybuty "style" -->

    <style>
        span {
            font-size: 70px;
            font-weight: bold;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div>
        <p>Paragraf</p>
        <span>Span</span>
    </div>

    <p style="color:tomato;font-size: 100px;">Paragraf drugi</p>

</body>

</html>
