<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Mini gra z sekwencją kolorowych kształtów w HTML i CSS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="object-start">
        <p>Kliknij mnie, aby rozpocząć!</p>
    </div>

    <div class="text-small">
        <p>(tak naprawdę to wystarczy najechać kursorem na to pole i go tak zostawić 😛)</p>
    </div>

    <div class="object-1"></div>

    <div class="object-2"></div>

    <div class="object-3"></div>

    <div class="object-4"></div>

    <div class="object-5"></div>

    <div class="object-6"></div>

    <div class="object-7"></div>

    <div class="object-end">
        <p>Koniec zabawy! 😊</p>
    </div>

    <div class="background-end"></div>

    <audio controls src="Happy Wheels - victory sound.mp3"></audio>

</body>

</html>
